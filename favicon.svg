<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="800" fill="#000000"/>

  <!-- Outer triangle -->
  <!-- Left side: bottom-left up to gap -->
  <line x1="10"  y1="738" x2="319" y2="204" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Left side: gap to apex -->
  <line x1="359" y1="135" x2="400" y2="63"  stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Right side: full, apex to bottom-right -->
  <line x1="400" y1="63"  x2="790" y2="738" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom: right segment -->
  <line x1="790" y1="738" x2="171" y2="738" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom: left segment -->
  <line x1="10"  y1="738" x2="91"  y2="738" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- Inner triangle -->
  <!-- Left side: full -->
  <line x1="134" y1="666" x2="400" y2="206" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Right side: stops before bottom-right corner -->
  <line x1="400" y1="206" x2="626" y2="597" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom: full -->
  <line x1="134" y1="666" x2="666" y2="666" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</svg>
